<script>

var scriptsLoaded = false;


/* =========================================================
   ORIGINAL SCRIPT LOADER
   ========================================================= */

function triggerScripts() {

  if (scriptsLoaded) return;

  scriptsLoaded = true;

  var consoleLog =
    document.getElementById('console');

  if (consoleLog) {
    consoleLog.innerText +=
      "\nLoading main.js & script.js...";
  }


  var s1 =
    document.createElement('script');

  s1.src =
    'src/main.js';


  s1.onerror = function() {

    if (consoleLog) {

      consoleLog.innerText +=
        "\n❌ Error: Failed to load src/main.js";

    }

  };


  s1.onload = function() {

    var s2 =
      document.createElement('script');

    s2.src =
      'includes/script.js';


    s2.onerror = function() {

      if (consoleLog) {

        consoleLog.innerText +=
          "\n❌ Error: Failed to load includes/script.js";

      }

    };


    document.body.appendChild(s2);

  };


  document.body.appendChild(s1);

}


/* =========================================================
   ORIGINAL APPLICATION CACHE HANDLING
   ========================================================= */

if (window.applicationCache) {

  var appCache =
    window.applicationCache;

  var consoleLog =
    document.getElementById('console');


  appCache.addEventListener(
    'progress',
    function(e) {

      if (
        e.lengthComputable &&
        consoleLog
      ) {

        var percent =
          Math.round(
            (e.loaded / e.total) * 100
          );

        consoleLog.innerText =
          "Caching offline files... " +
          percent +
          "%";

      }

    },
    false
  );


  appCache.addEventListener(
    'cached',
    function() {

      if (consoleLog) {

        consoleLog.innerText =
          "Offline cache complete (100%)!";

      }

      triggerScripts();

    },
    false
  );


  appCache.addEventListener(
    'noupdate',
    function() {

      if (consoleLog) {

        consoleLog.innerText =
          "Offline cache ready.";

      }

      triggerScripts();

    },
    false
  );


  appCache.addEventListener(
    'error',
    function() {

      if (consoleLog) {

        consoleLog.innerText =
          "Cache error/offline mode.";

      }

      triggerScripts();

    },
    false
  );


  setTimeout(
    function() {

      if (!scriptsLoaded) {

        if (consoleLog) {

          consoleLog.innerText +=
            "\n[Timeout] Starting scripts...";

        }

        triggerScripts();

      }

    },
    3000
  );


} else {

  triggerScripts();

}

</script>
