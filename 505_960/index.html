    .fz-phones {

      color: #eee;

      letter-spacing: 1px;
    }

    .fz-line {
      width: 58%;

      background:

        rgba(255,122,0,.45);

    .fz-badge {

      padding: 7px 14px;

    .fz-footer {

  <script>

    /* =========================================================
       ORIGINAL 6.72 / 5.05 LOGIC
       ========================================================= */

    window.entrypoint672_result = 0;

    window.exploitsetup672_result = 0;

    var config_target = 0x0000;

    var outputConsole =
      document.getElementById("console");


    window.log = function (msg, color) {

      if (color === undefined)
        color = "#cccccc";

      outputConsole.innerHTML +=
        '<span style="color:' +
        color +
        '">' +
        msg +
        '</span><br>';

    };


    window.getScriptES5 =
      function (source, callback) {

        var gs =
          document.createElement("script");

        gs.src = source;

        gs.onload = callback;

        gs.async = false;

        document.body.appendChild(gs);
      };


    window.addEventListener(
      "error",
      function (event) {

        var reason = event.error;

        var msg =
          "Unhandled error\n";

        if (reason) {

          msg += reason + "\n";

          if (reason.sourceURL)
            msg += reason.sourceURL;

          if (reason.line)
            msg += ":" + reason.line;

          if (reason.column)
            msg += ":" + reason.column;

          if (reason.stack)
            msg += "\n" + reason.stack;

        } else {

          msg +=
            "No error object";

        }

        alert(msg);

        return true;
      }
    );


    window.addEventListener(
      "load",
      function () {

        var ua =
          navigator.userAgent;

        var isPS4 =
          ua.indexOf(
            "PlayStation 4"
          ) !== -1;

        var is67x =
          (
            ua.indexOf(" 6.70") !== -1 ||
            ua.indexOf(" 6.71") !== -1 ||
            ua.indexOf(" 6.72") !== -1
          );

        if (
          isPS4 &&
          is67x &&
          window.applicationCache.status !== 0
        ) {

          var xhr =
            new XMLHttpRequest();

          xhr.open(
            "GET",
            "672entrypoint.js",
            false
          );

          xhr.send("");

          if (xhr.status === 200) {

            eval.call(
              top.window,
              xhr.responseText
            );

          }
        }
      }
    );


    window.checkPlatformIsSupported =
      function () {

        var userAgent =
          navigator.userAgent;

        var psRegex =
          /PlayStation (4|5)[ \/]([0-9]{1,2}\.[0-9]{2})/;

        var match =
          userAgent.match(psRegex);

        if (!match)
          return false;

        var device =
          match[1];

        var fwVersion =
          match[2];

        config_target =
          parseInt(
            fwVersion.replace(".", ""),
            16
          );

        window.log(
          "Firmware PS" +
          device +
          " : " +
          fwVersion +
          "\n"
        );


        var supportedFW = {

          "4": [
            "5.05",
            "6.70",
            "6.71",
            "6.72",
            "7.00",
            "7.01",
            "7.02",
            "7.50",
            "7.51",
            "7.55",
            "8.00",
            "8.01",
            "8.03",
            "8.50",
            "8.52",
            "9.00",
            "9.03",
            "9.04",
            "9.50",
            "9.51",
            "9.60"
          ],

          "5": [
            "0.00"
          ]

        };


        if (
          !supportedFW[device]
        )
          return false;


        return (
          supportedFW[device]
            .indexOf(
              fwVersion
            ) !== -1
        );

      };


    window.addEventListener(
      "load",
      function () {

        outputConsole.textContent =
          "";

        try {

          if (
            !window.checkPlatformIsSupported()
          ) {

            window.log(
              "PS4 5.05 — 9.60 فقط",
              "red"
            );

          } else {

            if (
              config_target === 0x505
            ) {

              window.log(
                "Starting 5.05 Exploit..."
              );

              window.getScriptES5(
                "505exploit.js",
                function () {

                  setTimeout(
                    exploit505,
                    3000
                  );

                }
              );

            } else {

              window.log(
                "Starting main exploit..."
              );

              window.getScriptES5(
                "main.js",
                function () {

                  setTimeout(
                    doJailBreak,
                    1500
                  );

                }
              );

            }

          }

        } catch (error) {

          window.log(
            "An error occured during exploit: " +
            error,
            "red"
          );

        }

      }
    );
